{%load static%}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ma ToDo-List</title>
    <link rel="text/css" href="{% static 'css/style.css'%}">
  </head>
  <body>
    <div class="container">
      <h2>Ma To-Do List</h2>
      <div class=create_task>
        <form method="POST">
          {% csrf_token %}
          
        <label for="title">Titre</label>
        <input type="text" id=title name="title" placeholder="Ex: Aller à la piscine">
        <label for="description">Decrivez votre tache</label>
        <input type="text" id="description" name="description" placeholder="Decrivez la tache">
        <label for="priority">Priorité</label>
        <select id=priority>
          <option name="faible">Faible</option>
          <option name="moyen">Moyenne</option>
          <option name="Urgent">Urgente</option>
        </select>
        <input type="submit" value="Creer">
      </form>
      </div>
    </div>
  </body>
</html>
